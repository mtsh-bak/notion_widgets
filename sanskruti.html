<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sanskruti 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose: #e8435a;
    --rose-light: #ffb3c1;
    --rose-dark: #c0183a;
    --gold: #f4c430;
    --cream: #fff8f0;
    --deep: #1a0a10;
    --pink-glow: rgba(232, 67, 90, 0.3);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d0005;
    font-family: 'Cormorant Garamond', serif;
    cursor: none;
  }

  /* Custom cursor */
  #cursor {
    position: fixed;
    width: 12px; height: 12px;
    background: var(--rose);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s, width 0.3s, height 0.3s;
    box-shadow: 0 0 12px var(--rose);
  }

  /* ── SCENE LAYERS ───────────────────────────────── */
  #scene {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* Starfield */
  #stars { position: absolute; inset: 0; overflow: hidden; }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite alternate;
    opacity: 0;
  }
  @keyframes twinkle {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: var(--max-op); transform: scale(1.2); }
  }

  /* Aurora background */
  #aurora {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 120% 60% at 20% 80%, rgba(180,20,60,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 100% 50% at 80% 20%, rgba(100,10,40,0.3) 0%, transparent 55%),
      radial-gradient(ellipse 80% 80% at 50% 50%, rgba(30,0,15,0.8) 0%, transparent 100%);
    animation: aurora 8s ease-in-out infinite alternate;
  }
  @keyframes aurora {
    0%   { filter: hue-rotate(0deg) brightness(1); }
    50%  { filter: hue-rotate(20deg) brightness(1.3); }
    100% { filter: hue-rotate(-15deg) brightness(0.9); }
  }

  /* ── PETALS / PARTICLES ─────────────────────────── */
  #petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .petal {
    position: absolute;
    top: -60px;
    font-size: 18px;
    animation: fall linear infinite;
    opacity: 0.8;
    filter: drop-shadow(0 0 4px var(--rose));
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(720deg) translateX(var(--drift)); opacity: 0; }
  }

  /* ── CENTRE CARD ────────────────────────────────── */
  #card {
    position: relative;
    z-index: 10;
    width: min(520px, 92vw);
    text-align: center;
    opacity: 0;
    transform: translateY(40px);
    animation: cardIn 1.6s cubic-bezier(0.16,1,0.3,1) 1s forwards;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Glass card */
  .glass {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(24px);
    border-radius: 28px;
    padding: 52px 44px 48px;
    box-shadow:
      0 0 80px rgba(232,67,90,0.15),
      inset 0 1px 0 rgba(255,255,255,0.12);
  }

  /* ── ORBITING HEARTS ────────────────────────────── */
  .orbit-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform-origin: 0 0;
    pointer-events: none;
  }
  .orbit-ring.r1 { animation: spin1 6s linear infinite; }
  .orbit-ring.r2 { animation: spin1 9s linear infinite reverse; }
  .orbit-ring.r3 { animation: spin1 13s linear infinite; }

  @keyframes spin1 { to { transform: rotate(360deg); } }

  .orbit-dot {
    position: absolute;
    font-size: 16px;
    filter: drop-shadow(0 0 6px var(--rose));
    transform: translate(-50%, -50%);
  }

  /* ── PULSAR HEART ───────────────────────────────── */
  #big-heart {
    font-size: 72px;
    display: block;
    margin: 0 auto 24px;
    filter: drop-shadow(0 0 30px var(--rose)) drop-shadow(0 0 60px rgba(232,67,90,0.5));
    animation: heartbeat 1.3s ease-in-out infinite;
    line-height: 1;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    14%      { transform: scale(1.13); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.08); }
    70%      { transform: scale(1); }
  }

  /* ── TYPOGRAPHY ─────────────────────────────────── */
  .name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 7vw, 3.2rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    line-height: 1.1;
    text-shadow: 0 0 40px rgba(232,67,90,0.8), 0 2px 8px rgba(0,0,0,0.6);
    animation: nameGlow 3s ease-in-out infinite alternate;
  }
  @keyframes nameGlow {
    from { text-shadow: 0 0 30px rgba(232,67,90,0.6), 0 2px 8px rgba(0,0,0,0.6); }
    to   { text-shadow: 0 0 60px rgba(232,67,90,1), 0 0 100px rgba(255,150,170,0.4), 0 2px 8px rgba(0,0,0,0.6); }
  }

  .divider {
    margin: 20px auto;
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose), transparent);
  }

  .message {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem, 3.5vw, 1.28rem);
    font-weight: 300;
    font-style: italic;
    color: rgba(255,255,255,0.85);
    line-height: 1.9;
    letter-spacing: 0.02em;
    margin-bottom: 32px;
  }
  .message em {
    font-style: normal;
    color: var(--rose-light);
    font-weight: 400;
  }

  /* ── REVEAL BUTTON ──────────────────────────────── */
  #reveal-btn {
    display: inline-block;
    padding: 14px 44px;
    background: transparent;
    border: 1px solid rgba(232,67,90,0.7);
    border-radius: 40px;
    color: var(--rose-light);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-style: italic;
    letter-spacing: 0.12em;
    cursor: none;
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
    margin-bottom: 0;
  }
  #reveal-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--rose);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s cubic-bezier(0.76,0,0.24,1);
    z-index: -1;
  }
  #reveal-btn:hover::before { transform: scaleX(1); }
  #reveal-btn:hover { color: #fff; border-color: var(--rose); box-shadow: 0 0 40px rgba(232,67,90,0.5); }

  /* ── CONFESSION OVERLAY ─────────────────────────── */
  #confession {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s;
    background: radial-gradient(ellipse at center, rgba(20,0,10,0.98) 0%, rgba(5,0,3,0.99) 100%);
  }
  #confession.visible { opacity: 1; pointer-events: all; }

  #confession-inner {
    text-align: center;
    max-width: 520px;
    padding: 0 24px;
    transform: scale(0.85);
    transition: transform 1s cubic-bezier(0.16,1,0.3,1);
  }
  #confession.visible #confession-inner { transform: scale(1); }

  .big-statement {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 10vw, 5.5rem);
    font-weight: 400;
    font-style: italic;
    color: #fff;
    line-height: 1.15;
    margin-bottom: 28px;
    opacity: 0;
    animation: none;
  }
  #confession.visible .big-statement {
    animation: wordIn 1s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
  }
  @keyframes wordIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .big-statement span {
    display: block;
    color: var(--rose);
    font-size: clamp(3rem, 13vw, 7rem);
    font-weight: 700;
    font-style: normal;
    text-shadow: 0 0 60px rgba(232,67,90,0.9), 0 0 120px rgba(232,67,90,0.4);
    animation: pulseText 2s ease-in-out infinite alternate;
  }
  @keyframes pulseText {
    from { text-shadow: 0 0 40px rgba(232,67,90,0.7); }
    to   { text-shadow: 0 0 80px rgba(232,67,90,1), 0 0 140px rgba(255,120,150,0.5); }
  }

  .sub-note {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: rgba(255,255,255,0.7);
    font-style: italic;
    letter-spacing: 0.06em;
    opacity: 0;
  }
  #confession.visible .sub-note {
    animation: wordIn 1s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
  }

  /* ── CONFETTI BURST ─────────────────────────────── */
  .confetti-piece {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 200;
    animation: confettiFall var(--d) ease-in var(--delay) forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
  }

  /* back button */
  #back-btn {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    z-index: 110;
    background: transparent; border: none;
    color: rgba(255,255,255,0.3);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.9rem; letter-spacing: 0.1em;
    cursor: none;
    opacity: 0; transition: opacity 0.5s, color 0.3s;
  }
  #back-btn:hover { color: rgba(255,255,255,0.7); }
  #confession.visible #back-btn { opacity: 1; }

  /* ── FLOATING HEARTS BURST ──────────────────────── */
  .burst-heart {
    position: fixed;
    pointer-events: none;
    z-index: 150;
    font-size: var(--size);
    animation: burstUp var(--d) ease-out var(--delay) forwards;
    filter: drop-shadow(0 0 8px var(--rose));
  }
  @keyframes burstUp {
    0%   { transform: translate(0,0) scale(0) rotate(0deg); opacity: 1; }
    60%  { opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot)); opacity: 0; }
  }

  /* ring animations for orbit */
  #orbit-container {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>

<div id="cursor"></div>

<div id="scene">
  <div id="stars"></div>
  <div id="aurora"></div>
  <div id="petals"></div>
  <div id="orbit-container"></div>

  <div id="card">
    <div class="glass">
      <!-- orbiting hearts are positioned relative to card center -->
      <span id="big-heart">♥</span>
      <div class="name">Sanskruti</div>
      <div class="divider"></div>
      <p class="message">
        In a universe full of stars,<br>
        my eyes always find <em>you</em>.<br><br>
        Every heartbeat whispers your name,<br>
        every silence feels like <em>home</em><br>
        when you're in it.
      </p>
      <button id="reveal-btn" onclick="revealLove()">
        open your heart &nbsp;♡
      </button>
    </div>
  </div>
</div>

<!-- Confession screen -->
<div id="confession">
  <div id="confession-inner">
    <p class="big-statement">
      I love you,<br>
      <span>Sanskruti.</span>
    </p>
    <p class="sub-note">
      from the deepest corner of my heart — always &amp; forever.
    </p>
  </div>
</div>
<button id="back-btn" onclick="hideConfession()">↩ close</button>

<script>
// ── CURSOR ───────────────────────────────────────────
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
});

// ── STARS ─────────────────────────────────────────────
const starsEl = document.getElementById('stars');
for (let i = 0; i < 220; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  const maxOp = (Math.random() * 0.5 + 0.3).toFixed(2);
  const dur = (Math.random() * 3 + 2).toFixed(1) + 's';
  const delay = (Math.random() * 4).toFixed(1) + 's';
  s.style.cssText = `
    width:${size}px; height:${size}px;
    top:${Math.random()*100}%; left:${Math.random()*100}%;
    --d:${dur}; --max-op:${maxOp};
    animation-delay:${delay};
  `;
  starsEl.appendChild(s);
}

// ── FALLING PETALS ────────────────────────────────────
const petalsEl = document.getElementById('petals');
const petalEmojis = ['🌸', '🌺', '✿', '❀', '♥', '❤', '💕'];
function addPetal() {
  const p = document.createElement('div');
  p.className = 'petal';
  const emoji = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
  const dur = (Math.random() * 8 + 7).toFixed(1) + 's';
  const drift = (Math.random() * 200 - 100).toFixed(0) + 'px';
  const size  = Math.random() * 14 + 12;
  p.textContent = emoji;
  p.style.cssText = `
    left: ${Math.random() * 110}%;
    font-size: ${size}px;
    animation-duration: ${dur};
    animation-delay: ${(Math.random() * 8).toFixed(1)}s;
    --drift: ${drift};
  `;
  petalsEl.appendChild(p);
  setTimeout(() => p.remove(), parseFloat(dur) * 1000 + 8000);
}
for (let i = 0; i < 16; i++) addPetal();
setInterval(addPetal, 900);

// ── ORBITING HEARTS ───────────────────────────────────
const orbitContainer = document.getElementById('orbit-container');
function makeOrbit(radius, heartCount, dur, dir) {
  const ring = document.createElement('div');
  ring.className = 'orbit-ring';
  ring.style.animation = `spin1 ${dur}s linear infinite ${dir}`;

  for (let i = 0; i < heartCount; i++) {
    const angle = (360 / heartCount) * i;
    const rad = angle * Math.PI / 180;
    const dot = document.createElement('div');
    dot.className = 'orbit-dot';
    dot.textContent = '♥';
    dot.style.cssText = `
      left: ${Math.cos(rad) * radius}px;
      top:  ${Math.sin(rad) * radius}px;
      font-size: ${14 - radius/30}px;
      opacity: ${0.5 + Math.random() * 0.4};
    `;
    ring.appendChild(dot);
  }
  orbitContainer.appendChild(ring);
}
makeOrbit(160, 6, 8, 'normal');
makeOrbit(220, 8, 13, 'reverse');
makeOrbit(290, 10, 18, 'normal');

// ── CONFESSION REVEAL ─────────────────────────────────
function burstHearts(x, y) {
  for (let i = 0; i < 30; i++) {
    const h = document.createElement('div');
    h.className = 'burst-heart';
    h.textContent = Math.random() > 0.5 ? '♥' : '♡';
    const angle = Math.random() * 360;
    const dist  = Math.random() * 280 + 80;
    const tx = Math.cos(angle * Math.PI/180) * dist;
    const ty = Math.sin(angle * Math.PI/180) * dist - 80;
    const dur   = (Math.random() * 1.2 + 0.8).toFixed(2);
    const delay = (Math.random() * 0.3).toFixed(2);
    const size  = Math.floor(Math.random() * 20 + 14) + 'px';
    const rot   = (Math.random() * 180 - 90).toFixed(0) + 'deg';
    h.style.cssText = `
      left:${x}px; top:${y}px;
      --tx:${tx}px; --ty:${ty}px;
      --d:${dur}s; --delay:${delay}s;
      --size:${size}; --rot:${rot};
      animation-delay:${delay}s;
    `;
    document.body.appendChild(h);
    setTimeout(() => h.remove(), (parseFloat(dur) + parseFloat(delay)) * 1000 + 200);
  }
}

function launchConfetti() {
  const colors = ['#e8435a','#ffb3c1','#f4c430','#fff','#ff7096','#ffd6e0'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    const tx = (Math.random() * window.innerWidth - window.innerWidth/2).toFixed(0) + 'px';
    const ty = (Math.random() * window.innerHeight + 200).toFixed(0) + 'px';
    const dur = (Math.random() * 2 + 1.2).toFixed(2) + 's';
    const delay = (Math.random() * 0.6).toFixed(2) + 's';
    const rot = (Math.random() * 720 - 360).toFixed(0) + 'deg';
    c.style.cssText = `
      left:${Math.random()*100}vw; top:20vh;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --tx:${tx}; --ty:${ty}; --d:${dur}; --delay:${delay}; --rot:${rot};
      animation-delay:${delay};
      transform: rotate(${Math.random()*360}deg);
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), (parseFloat(dur) + parseFloat(delay)) * 1000 + 300);
  }
}

function revealLove() {
  const btn = document.getElementById('reveal-btn');
  const rect = btn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top  + rect.height / 2;

  burstHearts(cx, cy);
  setTimeout(() => {
    document.getElementById('confession').classList.add('visible');
    launchConfetti();
    setTimeout(launchConfetti, 600);
  }, 400);
}

function hideConfession() {
  document.getElementById('confession').classList.remove('visible');
}

// ripple on click
document.addEventListener('click', e => {
  const ripple = document.createElement('div');
  ripple.style.cssText = `
    position:fixed; left:${e.clientX}px; top:${e.clientY}px;
    width:4px; height:4px; border-radius:50%;
    border:1px solid rgba(232,67,90,0.6);
    transform:translate(-50%,-50%);
    animation:rippleOut 0.8s ease-out forwards;
    pointer-events:none; z-index:9990;
  `;
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 800);
});

const style = document.createElement('style');
style.textContent = `
  @keyframes rippleOut {
    to { width: 80px; height: 80px; opacity: 0; border-width: 0.5px; }
  }
`;
document.head.appendChild(style);
</script>
</body>
</html>
